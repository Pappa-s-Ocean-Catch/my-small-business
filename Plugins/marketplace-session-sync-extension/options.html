<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Marketplace Session Sync Settings</title><style>body{font:16px Arial,sans-serif;max-width:620px;margin:40px auto;padding:0 20px;color:#172033}label{display:block;font-weight:600;margin-top:18px}input{box-sizing:border-box;width:100%;margin-top:6px;padding:10px}button{margin-top:20px;padding:10px 16px;background:#0f766e;color:#fff;border:0;border-radius:6px;font-weight:600}#status{margin-left:10px}</style></head>
  <body>
    <h1>Marketplace Session Sync</h1>
    <p>Sessions are sent only after you click the portal button. Cookies are never saved in extension settings.</p>
    <label>API base URL<input id="apiBaseUrl" type="url" placeholder="https://www.pappasfishnchips.com.au" autocomplete="off"></label>
    <label>Sync secret<input id="syncSecret" type="password" autocomplete="new-password"></label>
    <button id="save" type="button">Save settings</button><span id="status" role="status"></span>
    <script type="module" src="options.js"></script>
  </body>
</html>
