plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def loadEnv() {
    def env = new Properties()
    def candidateFiles = [
        file("${rootDir}/.env"),
        file("${rootDir}/../../.env"),
        file("${rootDir}/../pos-mirror/.env"),
        file("${rootDir}/../../.env.local")
    ]
    for (candidate in candidateFiles) {
        if (candidate.exists()) {
            candidate.withReader('UTF-8') { reader ->
                reader.eachLine { line ->
                    def trimmed = line.trim()
                    if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                        def parts = trimmed.split('=', 2)
                        def key = parts[0].trim()
                        def value = parts[1].trim()
                        if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
                            value = value.substring(1, value.length() - 1)
                        }
                        if (!env.containsKey(key)) {
                            env.put(key, value)
                        }
                    }
                }
            }
        }
    }
    return env
}

def env = loadEnv()

def getEnvVar(Properties env, String... keys) {
    for (key in keys) {
        def sysVal = System.getenv(key)
        if (sysVal != null && !sysVal.isEmpty()) return sysVal
        def envVal = env.getProperty(key)
        if (envVal != null && !envVal.isEmpty()) return envVal
    }
    return null
}

